name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Patch manifest.json to tag version
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.version = '$VERSION';
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          "

      - name: Build plugin
        run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          files: |
            main.js
            manifest.json
            styles.css
            versions.json
          body: |
            ## Scenarist ${{ steps.version.outputs.VERSION }}

            ### Установка
            1. Скачайте `main.js`, `manifest.json`, `styles.css`
            2. Создайте папку `.obsidian/plugins/obsidian-scenarist/` в вашем vault
            3. Скопируйте файлы в неё и перезапустите Obsidian

            Или через **BRAT**: добавьте `MrDarkOm/obsidian-scenarist`
